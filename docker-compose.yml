services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: rest_api
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./share/sql/rest_api.sql:/docker-entrypoint-initdb.d/rest_api.sql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=root"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_USER: root
      DB_PWD: root
      DB_DSN: tcp(db:3306)/rest_api?parseTime=true&tls=skip-verify
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DB_USER: root
      DB_PWD: root
      DB_DSN: tcp(db:3306)/rest_api?parseTime=true&tls=skip-verify
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "mariadb -h db -u root -proot --skip-ssl rest_api < share/sql/rest_api.sql && go test -v ./tests/"]

volumes:
  db_data:
